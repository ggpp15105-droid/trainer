<title>AI-Тренер</title>
<script>
function errBox(t){
 var b=document.getElementById('errbox');
 if(!b){
  b=document.createElement('div');
  b.id='errbox';
  b.style.cssText='position:fixed;top:0;left:0;right:0;'
   +'z-index:9999;background:#c0392b;color:#fff;'
   +'padding:10px;font:13px/1.4 monospace;white-space:pre-wrap';
  (document.body||document.documentElement).appendChild(b);
 }
 b.textContent=t;
}
window.addEventListener('error',function(e){
 errBox('Ошибка: '+(e.message||'?')
  +' (строка ~'+(e.lineno||'?')+')'
  +'. Пришли этот текст ассистенту целиком');
});
document.addEventListener('DOMContentLoaded',function(){
 setTimeout(function(){
  if(!window.__fitOk){
   errBox('Скрипт не дошёл до конца — файл обрезан. '
    +'Скопируй код из сообщения целиком и обнови.');
  }
 },1500);
});
/* ===== PWA: иконки PNG + manifest + service worker ===== */
function makeIcon(size){
 var c=document.createElement('canvas');
 c.width=size;c.height=size;
 var x=c.getContext('2d');
 var r=size*0.22;
 x.fillStyle='#5b8cff';
 x.beginPath();
 x.moveTo(r,0);x.lineTo(size-r,0);
 x.arcTo(size,0,size,size,r);
 x.lineTo(size,size-r);x.arcTo(size,size,0,size,r);
 x.lineTo(r,size);x.arcTo(0,size,0,0,r);
 x.lineTo(0,r);x.arcTo(0,0,size,0,r);
 x.closePath();x.fill();
 x.fillStyle='#ffffff';
 function rr(px,py,w,h,rd){
  x.beginPath();
  x.moveTo(px+rd,py);x.lineTo(px+w-rd,py);
  x.arcTo(px+w,py,px+w,py+h,rd);
  x.lineTo(px+w,py+h-rd);x.arcTo(px+w,py+h,px,py+h,rd);
  x.lineTo(px+rd,py+h);x.arcTo(px,py+h,px,py,rd);
  x.lineTo(px,py+rd);x.arcTo(px,py,px+w,py,rd);
  x.closePath();x.fill();
 }
 var u=size/100;
 rr(16*u,44*u,12*u,14*u,3*u);
 rr(72*u,44*u,12*u,14*u,3*u);
 rr(30*u,34*u,10*u,34*u,3*u);
 rr(60*u,34*u,10*u,34*u,3*u);
 x.fillRect(40*u,46*u,20*u,9*u);
 return c.toDataURL('image/png');
}
try{
 var mObj={
  name:'AI-Тренер',
  short_name:'Тренер',
  start_url:location.pathname,
  scope:location.pathname.slice(0,location.pathname.lastIndexOf('/')+1)||'/',
  display:'standalone',
  orientation:'portrait',
  background_color:'#0d0f13',
  theme_color:'#0d0f13',
  icons:[
   {src:makeIcon(192),sizes:'192x192',type:'image/png',purpose:'any'},
   {src:makeIcon(512),sizes:'512x512',type:'image/png',purpose:'any'}
  ]
 };
 var mBlob=new Blob([JSON.stringify(mObj)],
  {type:'application/manifest+json'});
 document.getElementById('mflink').href=URL.createObjectURL(mBlob);
}catch(e){}
try{
 if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
   navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
 }
}catch(e){}
</script>
<style>
:root{--bg:#0d0f13;--card:#161a22;--card2:#20262f;--txt:#e8ebf2;--mut:#8b93a5;--acc:#5b8cff;--ok:#3ecf8e;--warn:#ff8a80;--line:#283042}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:contain}
body{
 background-color:var(--bg);
 background-image:
  radial-gradient(circle at 18% 0%,
   rgba(91,140,255,.07),transparent 42%),
  radial-gradient(circle at 85% 100%,
   rgba(91,140,255,.05),transparent 40%),
  radial-gradient(rgba(255,255,255,.03) 1px,
   transparent 1.4px),
  linear-gradient(180deg,#11141b,#0b0d11);
 background-size:auto,auto,22px 22px,auto;
 background-attachment:fixed;
 color:var(--txt);
 font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
 padding-bottom:calc(104px + env(safe-area-inset-bottom));
}
main{max-width:680px;margin:0 auto;
 padding:calc(16px + env(safe-area-inset-top)) 16px 16px}
h1{font-size:21px;margin:6px 0 14px}
h2{font-size:18px;margin:12px 0 6px}
h3{font-size:15px;margin:12px 0 4px}
.card{
 background:linear-gradient(180deg,#1a1f2a,#141821);
 border:1px solid var(--line);
 border-radius:14px;
 padding:14px;margin:10px 0;
 box-shadow:0 2px 12px rgba(0,0,0,.35);
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
button{
 background:linear-gradient(180deg,#6b97ff,#4a76e8);
 color:#fff;border:0;border-radius:10px;
 padding:11px 16px;font-size:15px;font-weight:600;
 cursor:pointer;font-family:inherit;
 touch-action:manipulation;user-select:none;-webkit-user-select:none;
 box-shadow:0 2px 10px rgba(91,140,255,.25);
 transition:transform .08s ease,box-shadow .2s ease,
  background .2s ease,border-color .2s ease,color .2s ease;
}
button:active{transform:scale(.96)}
button.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500;box-shadow:none}
button.small{padding:8px 12px;font-size:14px}
button.danger{background:linear-gradient(180deg,#d9534f,#b03a36);box-shadow:0 2px 10px rgba(200,60,50,.2)}
.setc{
 min-width:40px;padding:9px 0;font-size:15px;
 border-radius:9px;background:var(--card2);
 border:1px solid var(--line);color:var(--mut);
 font-weight:700;box-shadow:none;
}
.setc:active{transform:scale(.9)}
.setc.on2{
 background:linear-gradient(180deg,#43d997,#2fb87b);
 border-color:var(--ok);color:#08351f;
}
@keyframes pop{
 0%{transform:scale(.75)}
 60%{transform:scale(1.12)}
 100%{transform:scale(1)}
}
.setc.pop{animation:pop .25s ease}
.chip{
 display:inline-block;padding:9px 14px;
 border-radius:999px;border:1px solid var(--line);
 background:var(--card2);cursor:pointer;
 font-size:14px;user-select:none;
 touch-action:manipulation;
 transition:transform .08s ease,background .2s ease,
  border-color .2s ease,color .2s ease;
}
.chip:active{transform:scale(.95)}
.chip.on{
 background:linear-gradient(180deg,#6b97ff,#4a76e8);
 border-color:var(--acc);color:#fff;
}
input,select,textarea{
 background:var(--card2);border:1px solid var(--line);
 border-radius:10px;color:var(--txt);
 padding:10px;font-size:16px;width:100%;
 font-family:inherit;
}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.mut{color:var(--mut);font-size:13px}
.warn{color:var(--warn)}
.okc{color:var(--ok)}
.kbig{font-size:30px;font-weight:700;line-height:1.1}
.kunit{font-size:15px;color:var(--mut);font-weight:600}
.kcenter{text-align:center}
.wring{position:relative;width:170px;height:170px;margin:8px auto}
.wring svg{position:absolute;inset:0}
.wring .in{
 position:absolute;inset:0;display:flex;
 flex-direction:column;align-items:center;justify-content:center;
 gap:1px;
}
.wring .in .v{font-size:24px;font-weight:800;line-height:1}
.wring .in .v .u{font-size:13px;font-weight:600;color:var(--mut)}
.wring .in .g{font-size:11px;color:var(--mut);line-height:1.3}
.wring .in .st{font-size:12px;font-weight:700;line-height:1.3}
.wovermsg{
 margin-top:8px;padding:8px 12px;border-radius:10px;
 font-size:13px;font-weight:600;
}
.wovermsg.hi{background:rgba(255,138,128,.12);color:var(--warn);border:1px solid rgba(255,138,128,.4)}
.wovermsg.mid{background:rgba(255,180,84,.1);color:#ffb454;border:1px solid rgba(255,180,84,.4)}
.wovermsg.ok{background:rgba(62,207,142,.1);color:var(--ok);border:1px solid rgba(62,207,142,.4)}
.wbars{display:flex;gap:5px;align-items:flex-end;justify-content:center;height:70px;margin-top:8px}
.wbar{
 width:26px;background:var(--acc);border-radius:4px 4px 0 0;
 position:relative;min-height:2px;
 transition:height .4s ease;
}
.wbar.over{background:var(--warn)}
.wbar .d{
 position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
 font-size:9.5px;color:var(--mut);white-space:nowrap;
}
.wbar .m{
 position:absolute;top:-15px;left:50%;transform:translateX(-50%);
 font-size:9px;color:var(--mut);white-space:nowrap;
}
.wline{
 position:relative;height:0;border-top:1px dashed rgba(255,180,84,.7);
 margin-bottom:-1px;
}
.wbtns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.weekstat{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ws{
 flex:1;min-width:100px;
 background:var(--card2);
 border:1px solid var(--line);
 border-radius:10px;padding:8px 10px;
 text-align:center;
}
.ws .v{font-size:18px;font-weight:700}
.ws .l{font-size:11px;color:var(--mut)}
#copied{
 font:12px/1.5 monospace;background:var(--card2);
 border:1px solid var(--line);border-radius:10px;
 padding:10px;max-height:200px;overflow:auto;
 white-space:pre-wrap;word-break:break-word;
}
nav{
 position:fixed;
 bottom:calc(8px + env(safe-area-inset-bottom));
 left:10px;right:10px;
 background:rgba(22,26,34,.92);
 border:1px solid var(--line);
 border-radius:18px;
 display:flex;gap:6px;padding:7px;
 z-index:5;
 box-shadow:0 8px 28px rgba(0,0,0,.55);
 backdrop-filter:blur(8px);
 -webkit-backdrop-filter:blur(8px);
}
nav button{
 flex:1;
 background:var(--card2);
 border:1px solid var(--line);
 border-radius:12px;
 padding:8px 2px 7px;
 display:flex;flex-direction:column;
 align-items:center;gap:2px;
 color:var(--mut);
 box-shadow:none;
 touch-action:manipulation;
}
nav button:hover{color:var(--txt)}
nav button .ic{font-size:18px;line-height:1}
nav button .lb{font-size:10.5px;font-weight:600;letter-spacing:.2px}
nav button.on{
 background:linear-gradient(180deg,#6b97ff,#4a76e8);
 border-color:#7ea6ff;
 color:#fff;
 box-shadow:0 3px 14px rgba(91,140,255,.4);
}
.tag{
 font-size:11px;color:var(--mut);
 border:1px solid var(--line);padding:1px 8px;
 border-radius:99px;margin-right:4px;
 white-space:nowrap;background:rgba(255,255,255,.02);
}
#modal{
 position:fixed;inset:0;
 background:rgba(5,7,10,.88);
 display:none;align-items:center;justify-content:center;
 z-index:15;padding:16px;
 padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
#modal .mbody{
 background:linear-gradient(180deg,#1a1f2a,#141821);
 border:1px solid var(--line);border-radius:16px;
 padding:18px;max-width:560px;width:100%;
 max-height:86vh;overflow:auto;
}
@keyframes modIn{
 from{opacity:0;transform:scale(.96)}
 to{opacity:1;transform:none}
}
#modal .mbody{animation:modIn .18s ease}
ol,ul{margin:4px 0 8px 20px}
li{margin:3px 0}
.bar{
 height:8px;background:var(--card2);
 border-radius:99px;overflow:hidden;margin:6px 0;
}
.bar i{
 display:block;height:100%;
 background:linear-gradient(90deg,#6b97ff,#4a76e8);
 transition:width 1s linear;
}
.blk.done .exname{text-decoration:line-through;opacity:.45}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
#restbar{
 position:fixed;left:12px;right:12px;
 bottom:calc(92px + env(safe-area-inset-bottom));
 background:rgba(32,38,47,.96);
 border:1px solid var(--acc);border-radius:14px;
 padding:10px 14px;z-index:6;
 box-shadow:0 6px 28px rgba(0,0,0,.55);
}
#restbar .t{font-size:20px;font-weight:700}
#restbar.done{border-color:var(--ok)}
#restbar.done .t{color:var(--ok)}
@keyframes bl{50%{opacity:.5}}
#restbar.done{animation:bl 1.1s infinite}
@keyframes restIn{
 from{opacity:0;transform:translateY(10px)}
 to{opacity:1;transform:none}
}
#restbar{animation:restIn .2s ease}
@keyframes viewIn{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:none}
}
main>section{animation:viewIn .22s ease}
@keyframes toastIn{
 from{opacity:0;transform:translate(-50%,8px)}
 to{opacity:1;transform:translate(-50%,0)}

#instban{
 display:none;position:fixed;
 left:10px;right:10px;
 bottom:calc(90px + env(safe-area-inset-bottom));
 background:linear-gradient(180deg,#1d2740,#16203a);
 border:1px solid var(--acc);border-radius:14px;
 padding:12px 14px;z-index:7;
}
#instban b{display:block;margin-bottom:4px}
#instban .x{
 position:absolute;top:4px;right:6px;
 background:none;box-shadow:none;color:var(--mut);
 font-size:16px;padding:4px 8px;
}
@media (prefers-reduced-motion:reduce){
 *{animation:none!important;transition:none!important}
}
</style>

function fmtT(s){

}
function ensureAC(){
 try{
  if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)()}
  if(AC.state==='suspended'){AC.resume()}
 }catch(e){}
}
function beepNow(){
 try{
  if(AC&&AC.state==='running'){
   var o=AC.createOscillator(),g=AC.createGain();
   o.connect(g);g.connect(AC.destination);
   o.type='sine';o.frequency.value=880;
   g.gain.setValueAtTime(0.0001,AC.currentTime);
   g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);
   g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+0.35);
   o.start();o.stop(AC.currentTime+0.4);
  }
 }catch(e){}
 try{if(navigator.vibrate){navigator.vibrate(180)}}catch(e){}
}
function beepDone(){beepNow();setTimeout(beepNow,500)}
function startRest(sec){
 if(!sec||sec<=0){return}
 ensureAC();
 if(TMR){clearInterval(TMR.iv)}
 TMR={left:sec,total:sec,iv:null,done:false};
 TMR.iv=setInterval(tickRest,1000);
 renderTimer();
}
function tickRest(){
 if(!TMR){return}
 TMR.left--;
 if(TMR.left<=0){
  TMR.left=0;TMR.done=true;
  clearInterval(TMR.iv);
  beepDone();renderTimer();
  setTimeout(function(){
   if(TMR&&TMR.done){TMR=null;renderTimer()}
  },7000);
 }else{renderTimer()}
}
function addRest(n){
 if(!TMR){return}
 ensureAC();
 if(TMR.iv){clearInterval(TMR.iv)}
 TMR.left+=n;
 TMR.total=Math.max(TMR.total,TMR.left);
 TMR.done=false;
 TMR.iv=setInterval(tickRest,1000);
 renderTimer();
}
function stopRest(){
 if(TMR){clearInterval(TMR.iv)}
 TMR=null;renderTimer();
}
function renderTimer(){
 var el=document.getElementById('restbar');
 if(!el){return}
 if(!TMR){el.style.display='none';el.classList.remove('done');return}
 el.style.display='block';
 if(TMR.done){el.classList.add('done')}else{el.classList.remove('done')}
 var w=TMR.total?Math.max(0,Math.min(100,TMR.left/TMR.total*100)):0;
 var s='<div class="row"><div class="grow"><span class="t">';
 if(TMR.done){s+='✓ Отдых закончен'}else{s+='⏱ '+fmtT(TMR.left)}
 s+='</span><div class="bar" style="margin-top:6px">';
 s+='<i style="width:'+w+'%"></i></div></div>';
 if(!TMR.done){
  s+='<button class="small ghost" data-act="restadd" data-n="30">+30 с</button>';
 }
 s+='<button class="small ghost" data-act="reststop">';
 s+=(TMR.done?'Ок':'✕')+'</button>';
 el.innerHTML=s;
}

function getSetArr(key,exId){

 if(!d||d.date!==todayStr()){return null}
 if(d.sets&&d.sets[key]&&d.sets[key][exId]){
  return d.sets[key][exId];
 }
 var ks=d.keys&&d.keys[key];
 if(ks&&ks.indexOf(exId)>=0){return'ALL'}
 return null;
}
function isExDone(key,b){
 var a=getSetArr(key,b.exerciseId);
 if(a==='ALL'){return true}
 if(!a){return false}

function weekRange(wn){
 var p=P(),i;
 if(!p||!p.plan){return null}
 var base=new Date(p.plan.createdAt||Date.now());
 base.setHours(12,0,0,0);
 var wd=(base.getDay()+6)%7;
 base.setDate(base.getDate()-wd);
 var a=new Date(base.getTime()+(wn-1)*7*864e5);
 var b=new Date(base.getTime()+wn*7*864e5-1);
 function ds(d){
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
 }
 return{from:ds(a),to:ds(b)};
}
function buildWeekSummary(wn){
 var p=P(),i,j;
 if(!p||!p.plan){return null}
 var r=weekRange(wn);
 if(!r){return null}
 var week=null;
 for(i=0;i<p.plan.weeks.length;i++){
  if(p.plan.weeks[i].weekNumber===wn){week=p.plan.weeks[i]}
 }
 var planned=(week&&week.days.length)||0;
 var done=0,fbs={},maxW={};
 for(i=0;i<p.logs.length;i++){
  var l=p.logs[i];
  if(l.date<r.from||l.date>r.to){continue}
  var cnt=0;
  for(j=0;j<l.items.length;j++){if(l.items[j].done){cnt++}}
  if(cnt>0){done++;fbs[l.feedback]=(fbs[l.feedback]||0)+1}
  for(j=0;j<l.items.length;j++){
   var it=l.items[j];
   if(it.done&&it.weight!=null){
    if(!maxW[it.exerciseId]||it.weight>maxW[it.exerciseId]){
     maxW[it.exerciseId]=it.weight;
    }
   }
  }
 }
 var kcal=0,prot=0,daysEaten=0;
 for(i=0;i<7;i++){
  var d=addDaysStr(r.from,i);
  var kk=0,kpp=0;
  for(j=0;j<p.food.length;j++){
   var m=p.food[j];
   if(m.date===d){kk+=m.kcal;kpp+=m.p}
  }
  if(kk>200){daysEaten++}
  kcal+=kk;prot+=kpp;
 }
 var avgDef=null;
 if(daysEaten>0){
  avgDef=Math.round((p.norm.kcal*daysEaten-kcal)/daysEaten);
 }
 var wDelta=null;
 var noon=function(x){return new Date(x+'T12:00:00').getTime()};
 var now=Date.now(),wl=p.weightLog;
 var A=[],Bs=[];
 for(i=0;i<wl.length;i++){
  var dt=now-noon(wl[i].date);
  if(dt<=7*864e5){A.push(wl[i])}
  else if(dt<=14*864e5){Bs.push(wl[i])}
 }
 if(A.length>=2&&Bs.length>=2){
  function av(arr){
   var t=0;for(var k=0;k<arr.length;k++){t+=arr[k].kg}
   return t/arr.length;
  }
  wDelta=+(av(A)-av(Bs)).toFixed(1);
 }
 var fbStr=[];
 if(fbs.easy){fbStr.push('легко: '+fbs.easy)}
 if(fbs.ok){fbStr.push('в норме: '+fbs.ok)}
 if(fbs.hard){fbStr.push('тяжело: '+fbs.hard)}
 return{from:r.from,to:r.to,planned:planned,done:done,
  fbs:fbStr,maxW:maxW,daysEaten:daysEaten,
  avgDef:avgDef,protAvg:daysEaten?Math.round(prot/daysEaten):null,
  wDelta:wDelta};
}

function pyramidSVG(pv,pn,fv,fn,cv,cn){
 var W=340,i;
 var lv=[
  {n:'Жиры',v:fv,nm:fn,base:'#ffb454',y:6,tw:130,bw:230,kc:9},
  {n:'Белки',v:pv,nm:pn,base:'#e0564a',y:60,tw:230,bw:300,kc:4},
  {n:'Углеводы',v:cv,nm:cn,base:'#5b8cff',y:114,tw:300,bw:340,kc:4}
 ];
 var s='<svg viewBox="0 0 '+W+' 172';
 s+='" style="width:100%;max-width:360px;display:block;margin:6px auto">';
 for(i=0;i<lv.length;i++){
  var L=lv[i];
  var x1=170-L.tw/2,x2=170+L.tw/2;
  var x3=170+L.bw/2,x4=170-L.bw/2;
  var yb=L.y+52;
  var pct=(L.nm>0)?(L.v/L.nm):0;
  var over=(pct>1.05);
  var fill=over?'var(--warn)':L.base;
  var tcol=over?'var(--warn)':'var(--txt)';
  s+='<clipPath id="mcp'+i+'">';
  s+='<polygon points="'+x1+','+L.y+' '+x2+','+L.y;
  s+=' '+x3+','+yb+' '+x4+','+yb+'"/></clipPath>';
  s+='<polygon points="'+x1+','+L.y+' '+x2+','+L.y;
  s+=' '+x3+','+yb+' '+x4+','+yb;
  s+='" fill="rgba(255,255,255,.05)" stroke="var(--line)"/>';
  var fh=52*Math.max(0,Math.min(1,pct));
  if(fh>0.5){
   var ry=yb-fh;
   s+='<rect x="0" y="'+ry.toFixed(1)+'" width="'+W;
   s+='" height="'+fh.toFixed(1)+'" clip-path="url(#mcp'+i+')';
   s+='" fill="'+fill+'" opacity="0.85"';
   s+=' style="transition:height .4s ease,y .4s ease"/>';
  }
  var t1=L.n+' '+Math.round(L.v)+' / '+Math.round(L.nm)+' г';
  s+='<text x="170" y="'+(L.y+24);
  s+='" text-anchor="middle" font-size="12.5" font-weight="700';
  s+='" fill="'+tcol+'">'+t1+'</text>';
  var kc=Math.round(L.v*L.kc);
  s+='<text x="170" y="'+(L.y+40);
  s+='" text-anchor="middle" font-size="10.5" fill="var(--mut)">';
  s+=kc+' ккал</text>';
 }
 s+='</svg>';
 return s;
}

function calcNorm(){
 var p=P();
 var hgt=+document.getElementById('n_h').value;
 var pr=p.profile;
 if(!hgt||!pr||!pr.weight||!pr.age){
  toast('Нужны рост здесь + вес и возраст из анкеты');return;
 }
 var bmr=10*pr.weight+6.25*hgt-5*pr.age+(pr.sex==='f'?-161:5);
 var t=bmr*1.55;
 if(pr.goal==='fatLoss'){t*=0.8}
 if(pr.goal==='muscleGain'){t*=1.1}
 var kcal=Math.round(t/50)*50;
 var prot=Math.round(pr.weight*(pr.goal==='fatLoss'?2:1.8));
 var fat=Math.round(kcal*0.27/9);
 var carb=Math.max(50,Math.round((kcal-prot*4-fat*9)/4));
 p.norm={kcal:kcal,protein:prot,fat:fat,carb:carb};
 pr.height=hgt;
 DB.save();renderFood();
 toast('Норма: '+kcal+' ккал · Б '+prot+' · Ж '+fat+' · У '+carb+' г');
}

function importData(inp){
 var f=inp.files[0];
 if(!f){return}
 var r=new FileReader();
 r.onload=function(){
  try{
   var t=String(r.result).replace(/^\uFEFF/,'');
   var a=t.indexOf('{'),b=t.lastIndexOf('}');
   if(a<0){throw new Error('bad')}
   var d=JSON.parse(t.slice(a,b+1));
   var p=P();
   if(d.plan){p.plan=d.plan}
   if(d.profile){p.profile=d.profile}
   if(d.history){p.history=d.history}
   if(d.logs){p.logs=d.logs}
   if(d.weightLog){p.weightLog=d.weightLog}
   if(d.food){p.food=d.food}
   if(d.norm){p.norm=d.norm}
   if(d.water){p.water=d.water}
   if(d.combos){p.combos=d.combos}
   if(d.waterGoal!==undefined){p.waterGoal=d.waterGoal}
   DB.save();
   planWeek=null;logWeek=null;logDaySel=null;
   toast('Импортировано ✓');go('plan');
  }catch(e){alert('Некорректный файл резервной копии')}
 };
 r.readAsText(f);
}

 if(!pl){return}
 p.history.splice(i,1);
 if(p.plan){p.history.unshift(p.plan)}
 p.plan=pl;DB.save();planWeek=null;
 toast('План восстановлен');go('plan');
}
/* ===== БАННЕР УСТАНОВКИ ===== */
var installEvt=null;
window.addEventListener('beforeinstallprompt',function(e){
 e.preventDefault();
 installEvt=e;
 var p=P();
 if(p&&p.instDismissed){return}
 var b=document.getElementById('instban');
 if(b){b.style.display='block'}
});
function dismissInst(){
 var p=P();
 p.instDismissed=true;
 DB.save();
 var b=document.getElementById('instban');
 if(b){b.style.display='none'}
}
/* ===== ЕДИНЫЙ ОБРАБОТЧИК КЛИКОВ ===== */
document.addEventListener('click',function(e){
 var el=e.target.closest?e.target.closest('[data-act]'):null;
 if(!el){return}
 var a=el.getAttribute('data-act');
 if(a==='go'){go(el.getAttribute('data-v'))}
 else if(a==='mlink'){openLink(el.getAttribute('data-url'))}
 else if(a==='instclose'){dismissInst()}
 else if(a==='planday'){
  planDayDow=+el.getAttribute('data-d');
  renderPlan();
 }
 else if(a==='set'){
  var key=el.getAttribute('data-key');
  var ex=el.getAttribute('data-ex');
  var idx=+el.getAttribute('data-i');
  var tot=+el.getAttribute('data-total');
  var rst=+el.getAttribute('data-rest')||0;
  var added=tgSet(key,ex,idx,tot);
  renderPlan();
  var sel='.setc[data-key="'+key+'"]';
  sel+='[data-ex="'+ex+'"][data-i="'+idx+'"]';
  var btn=document.querySelector(sel);
  if(btn){btn.classList.add('pop')}
  if(added&&rst>0){
   var arr=getSetArr(key,ex);
   var allDone=(arr==='ALL')||(arr&&arr.length>=tot);
   if(!allDone){startRest(rst)}
  }
 }
 else if(a==='rest'){startRest(+el.getAttribute('data-sec'))}
 else if(a==='restadd'){addRest(+el.getAttribute('data-n'))}
 else if(a==='reststop'){stopRest()}
 else if(a==='ex'){openEx(el.getAttribute('data-ex'))}
 else if(a==='pat'){libPat=el.getAttribute('data-p');renderLibChips();renderLibList()}
 else if(a==='delmeal'){delMeal(+el.getAttribute('data-id'))}
 else if(a==='delweight'){delWeight(el.getAttribute('data-date'))}
 else if(a==='dellog'){delLog(+el.getAttribute('data-id'))}
 else if(a==='restore'){restorePlan(+el.getAttribute('data-i'))}
 else if(a==='savelog'){saveLog()}
 else if(a==='foodm'){foodShift(-1)}
 else if(a==='foodp'){foodShift(1)}
 else if(a==='addlib'){addFromLib()}
 else if(a==='addmeal'){addMeal()}
 else if(a==='savenorm'){saveNorm()}
 else if(a==='calcnorm'){calcNorm()}
 else if(a==='addweight'){addWeight()}
 else if(a==='wplus'){addWater(250)}
 else if(a==='wplus7'){addWater(750)}
 else if(a==='wminus'){addWater(-250)}
 else if(a==='wauto'){
  var pp=P();
  var dd=new Date(foodDate+'T12:00:00');
  pp.waterGoal=calcWaterGoal(((dd.getDay()+6)%7)+1);
  DB.save();renderFood();toast('Цель воды: авто ✓');
 }
 else if(a==='comboSave'){saveCombo()}
 else if(a==='comboAdd'){addCombo(+el.getAttribute('data-i'))}
 else if(a==='comboDel'){delCombo(+el.getAttribute('data-i'))}
 else if(a==='copylogs'){copyWeekLogs()}
 else if(a==='obgoal'){OB.goal=el.getAttribute('data-v');renderOnboard()}
 else if(a==='oblevel'){OB.level=el.getAttribute('data-v');renderOnboard()}
 else if(a==='obeq'){tgArr(OB.equip,el.getAttribute('data-v'));renderOnboard()}
 else if(a==='obinj'){tgArr(OB.inj,el.getAttribute('data-v'));renderOnboard()}
 else if(a==='obnav'){
  var n=+el.getAttribute('data-n');
  if(n>0){
   if(OB.step===0&&!OB.goal){toast('Выберите цель');return}
   if(OB.step===1&&!OB.level){toast('Выберите уровень');return}
   if(OB.step===2&&!OB.equip.length){toast('Отметьте оборудование');return}
  }
  OB.step=Math.max(0,Math.min(6,OB.step+n));
  renderOnboard();
 }
 else if(a==='obfinish'){finishOnboard()}
 else if(a==='reonboard'){reonboard()}
 else if(a==='addprof'){addProfile()}
 else if(a==='delprof'){delProfile()}
 else if(a==='export'){exportData()}
 else if(a==='imp'){document.getElementById('impFile').click()}
 else if(a==='reset'){resetAll()}
});
document.addEventListener('change',function(e){
 var el=e.target;
 if(!el||!el.classList){return}
 if(el.classList.contains('dk')&&el.checked){
  var r=+el.getAttribute('data-rest')||0;
  if(r>0){startRest(r)}
 }
});
/* ===== СТАРТ ===== */
try{
 renderTimer();
 if(!P().profile){go('onboard')}else{go('plan')}
}catch(e){errBox('Ошибка запуска: '+e.message)}
window.__fitOk=true;
</script>
</body>
</html>
